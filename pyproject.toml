[project]
name = "homeops-ai"
version = "0.3.0"
description = "HomeOps AI - an MCP-first home service procurement and invoice-control agent for the Amazon Developer Hackathon."
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2.0,<3",
  "starlette>=0.47,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "boto3>=1.40,<2",
  "python-dotenv>=1.1,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<1",
  "pytest-asyncio>=1.1,<2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
